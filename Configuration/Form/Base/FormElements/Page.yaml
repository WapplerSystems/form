prototypes:
  standard:
    formElementsDefinition:
      Page:
        formEditor:
          editors:
            100:
              identifier: header
              templateName: Inspector-FormElementHeaderEditor
            200:
              identifier: label
              templateName: Inspector-TextEditor
              label: formEditor.elements.Page.editor.label.label
              propertyPath: label
            300:
              identifier: previousButtonLabel
              templateName: Inspector-TextEditor
              label: formEditor.elements.Page.editor.previousButtonLabel.label
              propertyPath: renderingOptions.previousButtonLabel
            400:
              identifier: nextButtonLabel
              templateName: Inspector-TextEditor
              label: formEditor.elements.Page.editor.nextButtonLabel.label
              propertyPath: renderingOptions.nextButtonLabel
            # WapplerSystems fork: statically declared here (instead of injected via
            # InjectTranslationEditorIntoFormElements) so site packages can override
            # or remove it per element like any other editor. The dynamic part
            # (which site languages exist) is resolved in JS, not here - see
            # getAvailableLanguages() in inspector-component.ts.
            9700:
              identifier: translations
              templateName: Inspector-TranslationEditor
              label: formEditor.elements.FormElement.editor.translations.label
              propertyPath: renderingOptions.translation.overrides
            # WapplerSystems fork: statically declared here (instead of injected via
            # InjectVariantsEditorIntoFormElements) so site packages can override or
            # remove it per element like any other editor.
            9800:
              identifier: variants
              templateName: Inspector-VariantsEditor
              label: formEditor.elements.FormElement.editor.variants.label
              propertyPath: variants
            9999:
              identifier: removeButton
              templateName: Inspector-RemoveElementEditor
          predefinedDefaults:
            renderingOptions:
              previousButtonLabel: formEditor.elements.Page.editor.previousButtonLabel.value
              nextButtonLabel: formEditor.elements.Page.editor.nextButtonLabel.value
          label: formEditor.elements.Page.label
          description: formEditor.elements.Page.description
          group: page
          groupSorting: 100
          _isTopLevelFormElement: true
          _isCompositeFormElement: true
          iconIdentifier: form-page
        implementationClassName: TYPO3\CMS\Form\Domain\Model\FormElements\Page
        renderingOptions:
          _isTopLevelFormElement: true
          _isCompositeFormElement: true
          nextButtonLabel: 'next Page'
          previousButtonLabel: 'previous Page'
