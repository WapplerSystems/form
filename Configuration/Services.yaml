services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  TYPO3\CMS\Form\:
    resource: '../Classes/*'
    exclude:
      - '../Classes/{Domain/Model}'
      - '../Classes/Mvc/Configuration/FormYamlConfiguration.php'

  # Explicitly declared public so that ConfigurationManager can receive it via
  # DI autowiring. Populated at container build time via FormYamlCollectorConfigurator.
  TYPO3\CMS\Form\Mvc\Configuration\FormYamlCollector:
    public: true
    configurator:
      - '@TYPO3\CMS\Form\DependencyInjection\FormYamlCollectorConfigurator'
      - 'configure'

  TYPO3\CMS\Form\SoftReference\FormPersistenceIdentifierSoftReferenceParser:
    tags:
      - name: softreference.parser
        parserKey: formPersistenceIdentifier

  TYPO3\CMS\Form\Mvc\Property\TypeConverter\FormDefinitionArrayConverter:
    tags:
      - name: extbase.type_converter
        priority: 10
        target: TYPO3\CMS\Form\Type\FormDefinitionArray
        sources: string

  TYPO3\CMS\Form\Storage\StorageAdapterFactory:
    public: true
    arguments:
      $adapters: !tagged_iterator form.storage.adapter

  _instanceof:
    TYPO3\CMS\Form\Storage\StorageAdapterInterface:
       tags: [ 'form.storage.adapter' ]

  # WapplerSystems fork: site-sender feature — decorate the core
  # FormDataProviders so the BE Site Configuration module knows about
  # `site_sender` as an additional inline child table.
  TYPO3\CMS\Form\Form\FormDataProvider\SiteTcaInline:
    decorates: TYPO3\CMS\Backend\Form\FormDataProvider\SiteTcaInline
  TYPO3\CMS\Form\Form\FormDataProvider\SiteDatabaseEditRow:
    decorates: TYPO3\CMS\Backend\Form\FormDataProvider\SiteDatabaseEditRow

  # WapplerSystems fork: challenge/response spam shield. Public because the
  # validators reach for it through GeneralUtility::makeInstance() —
  # Extbase's ValidatorResolver instantiates validators itself and does not
  # autowire their constructors, so a private service would not be reachable.
  TYPO3\CMS\Form\Security\FormChallengeService:
    public: true

  # WapplerSystems fork: mail log. Public because scheduler tasks are built by
  # the scheduler, not by the container — CleanupMailLogTask has to reach for
  # the repository through GeneralUtility::makeInstance(), which cannot autowire
  # a private service's constructor.
  TYPO3\CMS\Form\Domain\Repository\MailLogRepository:
    public: true
