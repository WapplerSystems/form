# WapplerSystems fork: rejects submissions whose free text looks
# machine-generated. A form-level validator - put it on the form root.
# See Classes/Validation/EntropySpamValidator.php for what the numbers mean.
prototypes:
  standard:
    validatorsDefinition:
      EntropySpam:
        implementationClassName: TYPO3\CMS\Form\Validation\EntropySpamValidator
        options:
          minimumEntropy: 1.8
          maximumEntropy: 5.8
          textFieldIdentifiers: []
          minimumLength: 20
          errorMessage: 'LLL:EXT:form/Resources/Private/Language/locallang.xlf:formLevelValidators.EntropySpam.errorMessage'
        formEditor:
          iconIdentifier: form-validator
          label: formEditor.elements.Form.editor.validators.EntropySpam.label
          # What a newly added validator starts out with in the form editor.
          #
          # Only `minimumLength` is seeded, and it has to be: its editor carries
          # an Integer property validator, and that one rejects an empty value
          # (see addPropertyValidators() in view-model.js). Without a seed the
          # validator could be added but the form could never be saved again.
          #
          # Everything else stays out on purpose. The two entropy thresholds have
          # no inspector editor at all (see Form.yaml) - seeding a value nobody
          # can change would only freeze a copy of it into every form definition.
          # `errorMessage` would override the translated default above with an
          # empty string, and `textFieldIdentifiers` has no editor either.
          predefinedDefaults:
            options:
              minimumLength: 20
