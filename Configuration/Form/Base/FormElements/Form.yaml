prototypes:
  standard:
    formElementsDefinition:
      Form:
        formEditor:
          predefinedDefaults:
            renderingOptions:
              submitButtonLabel: formEditor.elements.Form.editor.submitButtonLabel.value
              # WapplerSystems fork: pre-fill new forms' orientation only.
              # labelColumns is intentionally left unset here - it's an
              # all-or-nothing map (viewport identifier => numbersOfColumnsToUse
              # + classPattern/offsetClassPattern), so a partial seed (numbers
              # without patterns) would silently suppress the PHP-side default
              # classPatterns in HorizontalLayoutClassViewHelper instead of
              # using them. Leaving it unset here means new forms correctly
              # fall through to that PHP-side default (sm=3/md=2, Bootstrap
              # col-*/offset-* classes) until a form or site package defines
              # its own viewPorts map.
              layout:
                orientation: vertical
          editors:
            100:
              identifier: header
              templateName: Inspector-FormElementHeaderEditor
            200:
              identifier: label
              templateName: Inspector-TextEditor
              label: formEditor.elements.BaseFormElementMixin.editor.label.label
              propertyPath: label
            300:
              identifier: submitButtonLabel
              templateName: Inspector-TextEditor
              label: formEditor.elements.Form.editor.submitButtonLabel.label
              propertyPath: renderingOptions.submitButtonLabel
            900:
              identifier: finishers
              templateName: Inspector-FinishersEditor
              label: formEditor.elements.Form.editor.finishers.label
              selectOptions:
                10:
                  value: ''
                  label: formEditor.elements.Form.editor.finishers.EmptyValue.label
                20:
                  value: EmailToSender
                  label: formEditor.elements.Form.editor.finishers.EmailToSender.label
                30:
                  value: EmailToReceiver
                  label: formEditor.elements.Form.editor.finishers.EmailToReceiver.label
                40:
                  value: Redirect
                  label: formEditor.elements.Form.editor.finishers.Redirect.label
                50:
                  value: DeleteUploads
                  label: formEditor.elements.Form.editor.finishers.DeleteUploads.label
                60:
                  value: Confirmation
                  label: formEditor.elements.Form.editor.finishers.Confirmation.label
            # WapplerSystems fork: form-wide (cross-field) validators. The form
            # root accepts a `validators` list exactly like any element does and
            # RunFormLevelValidators evaluates it after per-element validation -
            # this editor is what makes that reachable without hand-editing YAML.
            # The three entries below are the fork's own form-level validators;
            # a site package adds its own by extending selectOptions and
            # propertyCollections.validators here, same as for finishers.
            920:
              identifier: formValidators
              templateName: Inspector-ValidatorsEditor
              label: formEditor.elements.Form.editor.validators.label
              selectOptions:
                10:
                  value: ''
                  label: formEditor.elements.Form.editor.validators.EmptyValue.label
                20:
                  value: MinimumFillTime
                  label: formEditor.elements.Form.editor.validators.MinimumFillTime.label
                30:
                  value: EntropySpam
                  label: formEditor.elements.Form.editor.validators.EntropySpam.label
                40:
                  value: Challenge
                  label: formEditor.elements.Form.editor.validators.Challenge.label
            # WapplerSystems fork: JavaScript challenge/response spam shield,
            # modelled on EXT:form_crshield. A rendering option rather than only
            # a validator, because that is what lets a site switch it on for
            # *every* form at once by setting it on the prototype - a
            # `validators` list on the form root cannot be defaulted that way.
            # ValidateFormChallenge turns the switch into a run of
            # ChallengeValidator; InjectFormChallenge emits the challenge and the
            # frontend module.
            #
            # `maxAge` is deliberately NOT editor-facing: it interacts with the
            # page cache (the challenge is issued when the cache entry is
            # written, not when the visitor loads the page), so a value below the
            # cache lifetime silently rejects legitimate submissions. It stays a
            # YAML-only expert setting - see Validators/Challenge.yaml.
            930:
              identifier: challengeEnable
              templateName: Inspector-CheckboxEditor
              label: formEditor.elements.Form.editor.challenge.enable.label
              propertyPath: renderingOptions.challenge.enable
            940:
              identifier: challengeDelay
              templateName: Inspector-TextEditor
              label: formEditor.elements.Form.editor.challenge.delay.label
              description: formEditor.elements.Form.editor.challenge.delay.description
              propertyPath: renderingOptions.challenge.delay
              doNotSetIfPropertyValueIsEmpty: true
              propertyValidators:
                10: Integer
            950:
              identifier: challengeObfuscationMethod
              templateName: Inspector-SingleSelectEditor
              label: formEditor.elements.Form.editor.challenge.obfuscationMethod.label
              description: formEditor.elements.Form.editor.challenge.obfuscationMethod.description
              propertyPath: renderingOptions.challenge.obfuscationMethod
              selectOptions:
                10:
                  value: rot13reverse
                  label: formEditor.elements.Form.editor.challenge.obfuscationMethod.option.rot13reverse
                20:
                  value: rot13
                  label: formEditor.elements.Form.editor.challenge.obfuscationMethod.option.rot13
                30:
                  value: reverse
                  label: formEditor.elements.Form.editor.challenge.obfuscationMethod.option.reverse
                40:
                  value: base64
                  label: formEditor.elements.Form.editor.challenge.obfuscationMethod.option.base64
                50:
                  value: none
                  label: formEditor.elements.Form.editor.challenge.obfuscationMethod.option.none
            # WapplerSystems fork: horizontal label/input layout, form-wide. The
            # actual orientation switch is typically driven externally (e.g. a
            # site package copying a tt_content field into renderingOptions.layout.orientation
            # before rendering) - this editor lets it also be set directly per form.
            # See Classes/ViewHelpers/HorizontalLayoutClassViewHelper.php for how
            # orientation + labelColumns are turned into CSS classes. The set of
            # breakpoints ("Stufen") and their CSS class patterns are themselves
            # YAML-defined, exactly like GridRow/GridColumn's own
            # gridColumnClassAutoConfiguration - a site package can add e.g. "lg"
            # purely via YAML (renderingOptions.layout.labelColumns.viewPorts.lg.*),
            # no PHP changes needed. Only the numeric column split is editor-facing
            # below (9610); which breakpoints get an editor button at all is a
            # second, separate YAML concern (this editor's own
            # configurationOptions.viewPorts list).
            9600:
              identifier: layoutOrientation
              templateName: Inspector-SingleSelectEditor
              label: formEditor.elements.Form.editor.layoutOrientation.label
              propertyPath: renderingOptions.layout.orientation
              selectOptions:
                10:
                  value: vertical
                  label: formEditor.elements.Form.editor.layoutOrientation.option.vertical
                20:
                  value: horizontal
                  label: formEditor.elements.Form.editor.layoutOrientation.option.horizontal
            # WapplerSystems fork: same viewport-button + number-input UI as the
            # GridRow/GridColumn "gridColumnViewPortConfiguration" editor
            # (Configuration/Form/Base/FormElements/Checkbox.yaml etc.), but via
            # Inspector-ViewPortColumnEditor instead of
            # Inspector-GridColumnViewPortConfigurationEditor - the latter's JS
            # is hard-wired to elements that are children of a GridRow (it looks
            # up getCurrentlySelectedFormElement().get('__parentRenderable') and
            # crashes with "Cannot read properties of null (reading 'get')" for
            # any element without a parent, e.g. the Form root).
            # Inspector-ViewPortColumnEditor reuses the identical Fluid partial
            # and JS behavior, just without that GridRow-parent guard - see
            # renderViewPortColumnEditor() in inspector-component.ts/js.
            9610:
              identifier: layoutLabelColumns
              templateName: Inspector-ViewPortColumnEditor
              label: formEditor.elements.Form.editor.layoutLabelColumns.label
              configurationOptions:
                viewPorts:
                  10:
                    viewPortIdentifier: sm
                    label: formEditor.elements.Form.editor.layoutLabelColumns.sm.label
                  20:
                    viewPortIdentifier: md
                    label: formEditor.elements.Form.editor.layoutLabelColumns.md.label
                numbersOfColumnsToUse:
                  label: formEditor.elements.Form.editor.layoutLabelColumns.numbersOfColumnsToUse.label
                  propertyPath: 'renderingOptions.layout.labelColumns.viewPorts.{@viewPortIdentifier}.numbersOfColumnsToUse'
                  description: formEditor.elements.Form.editor.layoutLabelColumns.numbersOfColumnsToUse.description
            # WapplerSystems fork: statically declared here (instead of injected via
            # InjectTranslationEditorIntoFormElements) so site packages can override
            # or remove it per element like any other editor. The dynamic part
            # (which site languages exist) is resolved in JS, not here - see
            # getAvailableLanguages() in inspector-component.ts.
            9700:
              identifier: translations
              templateName: Inspector-TranslationEditor
              label: formEditor.elements.FormElement.editor.translations.label
              propertyPath: renderingOptions.translation.overrides
            9710:
              identifier: translationsOverview
              templateName: Inspector-TranslationOverviewEditor
              label: formEditor.elements.Form.editor.translationsOverview.label
            # WapplerSystems fork: statically declared here (instead of injected via
            # InjectVariantsEditorIntoFormElements) so site packages can override or
            # remove it per element like any other editor.
            9800:
              identifier: variants
              templateName: Inspector-VariantsEditor
              label: formEditor.elements.FormElement.editor.variants.label
              propertyPath: variants
          _isCompositeFormElement: false
          _isTopLevelFormElement: true
          saveSuccessFlashMessageTitle: formEditor.elements.Form.saveSuccessFlashMessageTitle
          saveSuccessFlashMessageMessage: formEditor.elements.Form.saveSuccessFlashMessageMessage
          saveErrorFlashMessageTitle: formEditor.elements.Form.saveErrorFlashMessageTitle
